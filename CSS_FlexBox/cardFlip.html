<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Card Flip Animation</title>
  <link rel="stylesheet" href="cardFlip.css">
</head>
<body>
  <div class="wrapper">
    <h1 class="title">🌿 3D Card Flip Animation</h1>
    <div class="card">
      <div class="card-inner">
        <!-- Front Side -->
        <div class="card-front">
          <img src="image.png" alt="Nature Image">
          <h2>Nature Beauty</h2>
        </div>

        <!-- Back Side -->
        <div class="card-back">
          <h2>About This</h2>
          <p>
            Nature’s beauty inspires calmness, creativity, and care for our planet.  
            Let’s cherish and protect it together 🌍💚
          </p>
          <button>Learn More</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
