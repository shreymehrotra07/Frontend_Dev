<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Photo Gallery</title>
  <link rel="stylesheet" href="photoGallery.css">
</head>
<body>
  <header>
    <h1 class="title">📸 My Photo Gallery</h1>
    <p class="subtitle">A collection of my favorite moments</p>
  </header>

  <section class="gallery">
    <figure>
      <img src="image.png" alt="Nature">
      <figcaption>Peaceful Forest</figcaption>
    </figure>

    <figure>
      <img src="image copy.png" alt="Mountain">
      <figcaption>Majestic Mountains</figcaption>
    </figure>

    <figure>
      <img src="image copy 2.png" alt="City">
      <figcaption>City Lights</figcaption>
    </figure>

    <figure>
      <img src="image copy 3.png" alt="Beach">
      <figcaption>Sunny Beach</figcaption>
    </figure>

    <figure>
      <img src="image copy 4.png" alt="River">
      <figcaption>Flowing River</figcaption>
    </figure>

    <figure>
      <img src="image copy 5.png" alt="Flowers">
      <figcaption>Blooming Garden</figcaption>
    </figure>

    <figure>
      <img src="image copy 6.png" alt="Desert">
      <figcaption>Golden Desert</figcaption>
    </figure>

    <figure>
      <img src="image copy 7.png" alt="Snow">
      <figcaption>Winter Wonderland</figcaption>
    </figure>
  </section>

  <footer>
    <p>© 2025 Shrey Mehrotra | All Rights Reserved 🌿</p>
  </footer>
</body>
</html>
