<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Product Gallery</title>
    <link rel="stylesheet" href="productGallery.css">
</head>

<body>
    <header>
        <h1 class="title">🛍️ Featured Products</h1>
    </header>

    <section class="gallery">
        <div class="card">
            <img src="image copy 8.png" alt="Product 1">
            <h2>Smart Watch</h2>
            <p class="price">$59.99</p>
            <button>Buy Now</button>
        </div>
        <div class="card">
            <img src="image copy 9.png" alt="Product 2">
            <h2>Wireless Headphones</h2>
            <p class="price">$79.99</p>
            <button>Buy Now</button>
        </div>
        <div class="card">
            <img src="image copy 10.png" alt="Product 3">
            <h2>Bluetooth Speaker</h2>
            <p class="price">$49.99</p>
            <button>Buy Now</button>
        </div>
        <div class="card">
            <img src="image copy 11.png" alt="Product 4">
            <h2>Wireless Mouse</h2>
            <p class="price">$19.99</p>
            <button>Buy Now</button>
        </div>
        <div class="card">
            <img src="image copy 12.png" alt="Product 5">
            <h2>Gaming Keyboard</h2>
            <p class="price">$69.99</p>
            <button>Buy Now</button>
        </div>
        <div class="card">
            <img src="image copy 13.png" alt="Product 6">
            <h2>DSLR Camera</h2>
            <p class="price">$499.99</p>
            <button>Buy Now</button>
        </div>
        <div class="card">
            <img src="image copy 14.png" alt="Product 7">
            <h2>Power Bank</h2>
            <p class="price">$29.99</p>
            <button>Buy Now</button>
        </div>
        <div class="card">
            <img src="image copy 15.png" alt="Product 8">
            <h2>Smart Glasses</h2>
            <p class="price">$199.99</p>
            <button>Buy Now</button>
        </div>
    </section>
</body>

</html>
